<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b3f92">
  <meta name="color-scheme" content="light">
  <title>板橋戰情中心</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Milestone 1</p>
        <h1>板橋戰情中心</h1>
        <p class="subtitle" id="monthSubtitle">載入中⋯</p>
      </div>
      <div class="top-actions">
        <button class="btn btn-primary" id="importBtn">匯入業績追蹤.xlsx</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
        <button class="btn btn-soft" id="saveBtn">儲存設定</button>
      </div>
    </header>

    <section class="import-box" aria-live="polite">
      <div>
        <strong>Excel 匯入狀態</strong>
        <p id="importStatus">尚未匯入。系統固定讀取 Data、對應表、門號表、人員表。</p>
      </div>
      <span class="status-chip" id="lastUpdated">未更新</span>
    </section>

    <nav class="tabs" aria-label="主要功能">
      <button class="tab active" data-page="dashboard">戰情首頁</button>
      <button class="tab" data-page="people">個人業績</button>
      <button class="tab" data-page="weekly">每週目標</button>
      <button class="tab" data-page="lagging">落後名單</button>
    </nav>

    <section class="page active" id="page-dashboard">
      <div class="section-heading">
        <div><h2>全店 KPI</h2><p>實績由 Excel 匯入，目標可手動設定。</p></div>
        <button class="btn btn-soft" id="autoAllocateBtn">自動分配剩餘週目標</button>
      </div>
      <div class="kpi-grid" id="storeKpiGrid"></div>

      <div class="section-heading compact"><div><h2>月底預估</h2><p>依目前月累計與已過天數推估。</p></div></div>
      <div class="forecast-grid" id="forecastGrid"></div>

      <div class="section-heading compact"><div><h2>今日重點</h2><p>只顯示目前最需要追蹤的項目。</p></div></div>
      <div class="focus-list" id="focusList"></div>
    </section>

    <section class="page" id="page-people">
      <div class="section-heading">
        <div><h2>個人業績</h2><p>以工號為主鍵；名稱顯示為「工號-綽號」。</p></div>
      </div>
      <div class="people-list" id="peopleList"></div>
    </section>

    <section class="page" id="page-weekly">
      <div class="section-heading">
        <div><h2>每週目標與完成率</h2><p>每月固定 1～4 週，週日開始；第 4 週包含月底剩餘日期。</p></div>
        <select id="weekSelect" class="select-inline" aria-label="選擇週次"></select>
      </div>
      <div class="weekly-list" id="weeklyList"></div>
    </section>

    <section class="page" id="page-lagging">
      <div class="section-heading">
        <div><h2>落後進度表</h2><p>依今天應達進度排序，最落後者排在前面。</p></div>
      </div>
      <div class="lag-summary" id="lagSummary"></div>
      <div class="table-scroller">
        <table>
          <thead><tr><th>人員</th><th>項目</th><th>目前達成</th><th>今日應達</th><th>落後差距</th><th>剩餘每日需完成</th><th>月底預估</th></tr></thead>
          <tbody id="lagTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state hidden" id="lagEmpty">目前沒有落後項目。</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
